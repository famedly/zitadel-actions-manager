services:
  zitadel:
    container_name: zitadel
    restart: 'unless-stopped'
    image: 'ghcr.io/zitadel/zitadel:v2.67.1'
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled'
    environment:
      - 'ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH=/machinekey/service-account.json'
      - 'ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME=zitadel-admin-sa'
      - 'ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME=Admin'
      - 'ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE=1'

      - 'ZITADEL_EXTERNALDOMAIN=localhost'
      - 'ZITADEL_EXTERNALPORT=9310'
      - 'ZITADEL_PORT=9310'
      - 'ZITADEL_EXTERNAL=localhost'
      - 'ZITADEL_TLS_ENABLED=false'

      - 'ZITADEL_DATABASE_POSTGRES_HOST=postgres'
      - 'ZITADEL_DATABASE_POSTGRES_PORT=5432'
      - 'ZITADEL_DATABASE_POSTGRES_DATABASE=zitadel'
      - 'ZITADEL_DATABASE_POSTGRES_USER_USERNAME=zitadel'
      - 'ZITADEL_DATABASE_POSTGRES_USER_PASSWORD=zitadel'
      - 'ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE=disable'
      - 'ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME=postgres'
      - 'ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD=password'
      - 'ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE=disable'
      # - 'ZITADEL_EXTERNALSECURE=false'
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - '9310:9310'
    volumes:
      - /tmp/zitadel-docker-test/:/machinekey/:rw

  zitadel_readiness_check:
    image: alpine/curl
    restart: on-failure
    command: 'curl -fsS zitadel:9310/debug/ready'
    depends_on:
      zitadel: { condition: 'service_started' }

  postgres:
    container_name: postgres
    restart: "unless-stopped"
    image: postgres:16.1-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - 9876:5432/tcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432"]
      interval: 5s
      retries: 10
      start_period: 5s

  ultimate_readiness_check:
    image: alpine/curl
    command: 'curl -V'
    depends_on:
      zitadel_readiness_check: { condition: 'service_completed_successfully' }

volumes:
  postgresql-data:
