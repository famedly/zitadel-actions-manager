# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  conventional_commits:
    if: github.ref != 'refs/heads/main' && github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Check conventional commits
        run: |
          COMMIT_MSGS=$(git log --no-merges --format=%s origin/main..HEAD)
          FAILED=0
          while IFS= read -r msg; do
            if [[ ! "$msg" =~ ^(ci|feat|fix|docs|style|refactor|perf|test|chore|build|revert)(\(.+\))?:\ .+ ]]; then
              echo "::error::Invalid commit message: $msg"
              FAILED=1
            fi
          done <<< "$COMMIT_MSGS"
          exit $FAILED
name: General checks (conventional commits)
"on":
  pull_request: {}
permissions:
  contents: read
