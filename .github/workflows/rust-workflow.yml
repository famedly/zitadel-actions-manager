name: Rust

# Trigger the CI on any tags, pushes to any branch and PRs to any branch.
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

# Make sure there is no pipeline running uselessly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Environment variables for all jobs.
env:
  CARGO_TERM_COLOR: always

# Defined CI jobs.
# Based on famedly/backend-build-workflows/.github/workflows/rust-workflow.yml@v1
# but had to separate tests to give docker support.
jobs:
  simple-checks:
    container: registry.famedly.net/docker-oss/rust-container:nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - uses: famedly/backend-build-workflows/.github/actions/rust-prepare@main
        with:
          gitlab_user: ${{ secrets.GITLAB_USER }}
          gitlab_pass: ${{ secrets.GITLAB_PASS }}

      - name: Caching
        uses: Swatinem/rust-cache@65012b490220f477f20ab979e35ae732e6de4e68
        with:
          cache-on-failure: true
          cache-all-crates: true

      - name: Rustfmt
        shell: bash
        run: cargo +${NIGHTLY_VERSION} fmt -- --check

      - name: Clippy
        shell: bash
        run: cargo +${NIGHTLY_VERSION} clippy  --workspace --all-features --all-targets -- -D warnings

      - name: Doc-test
        shell: bash
        run: cargo +${NIGHTLY_VERSION} test --doc --all-features --workspace --verbose

      - name: Udeps
        shell: bash
        run: cargo +${NIGHTLY_VERSION} udeps --all-features

      - name: Typos
        shell: bash
        run: typos --exclude '*.key' --exclude '*.crt' --exclude '*.csr' --exclude '*.srl' --exclude 'service-user*.json'

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - uses: famedly/backend-build-workflows/.github/actions/rust-prepare@main
        with:
          gitlab_user: ${{ secrets.GITLAB_USER }}
          gitlab_pass: ${{ secrets.GITLAB_PASS }}

      - name: Add llvm-tools rust component
        run: rustup component add llvm-tools-preview --toolchain stable-x86_64-unknown-linux-gnu

      - name: Caching
        uses: Swatinem/rust-cache@65012b490220f477f20ab979e35ae732e6de4e68
        with:
          cache-on-failure: true
          cache-all-crates: true

      - name: Install additional cargo tooling
        shell: bash
        run: cargo install cargo-nextest cargo-llvm-cov --locked

      - name: Test
        timeout-minutes: 20
        shell: bash
        run: |
          cargo llvm-cov nextest --profile ci --workspace --all-features --lcov --output-path lcov.info

      - name: Get docker logs on failure
        shell: bash
        if: failure()
        run: |
          docker compose --project-directory . logs

      - name: Codecov - Upload coverage
        uses: codecov/codecov-action@ca0a928a4cb3911011e868128a5cd90437c12db1
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: lcov.info

      - name: Codecov - Upload test results
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{secrets.CODECOV_TOKEN}}

  publish:
    needs: [simple-checks, tests]
    uses: famedly/backend-build-workflows/.github/workflows/publish-crate.yml@v5
    secrets:
      CRATE_REGISTRY_SSH_PRIVKEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
      CRATE_REGISTRY_AUTH_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
