# This file is automatically generated from Nix configuration. Do not edit directly.

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: cachix/install-nix-action@51f3067b56fe8ae331890c77d4e454f6d60615ff
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - env:
          GH_TOKEN: ${{ secrets.ENGINEERING_STANDARDS_READ }}
        name: Configure Git auth for Nix daemon
        run: |
          set -euo pipefail
          if [[ -n "${GH_TOKEN:-}" ]]; then
            sudo git config --system url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
        shell: bash
      - name: Install Rust toolchain (pinned)
        run: nix profile install .#famedly-rust-toolchain
      - env:
          ADDITIONAL_PACKAGES: ""
          CARGO_HOME: .cargo
          CRATE_REGISTRY_INDEX_URL: https://git.shipyard.rs/famedly/crate-index.git
          CRATE_REGISTRY_NAME: famedly
          SHIPYARD_RS_TOKEN: ${{ secrets.SHIPYARD_RS_TOKEN }}
        name: Prepare Rust environment
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$(pwd)"

          if [[ "$(id -u)" -eq 0 ]]; then SUDO=""; else SUDO="sudo"; fi

          if [[ -n "${ADDITIONAL_PACKAGES:-}" ]]; then
            read -ra packages <<< "${ADDITIONAL_PACKAGES}"
            $SUDO apt-get install -yqq --no-install-recommends "${packages[@]}"
          fi

          mkdir -p "${HOME}/${CARGO_HOME}"

          if [[ -z "${SHIPYARD_RS_TOKEN:-}" ]]; then
            export CRATE_REGISTRY_NAME="crates-io"
          else
            git config --global credential.helper store
            echo "https://famedly:${SHIPYARD_RS_TOKEN}@git.shipyard.rs" > ~/.git-credentials
            chmod 600 ~/.git-credentials
          fi

          cat << EOF >> "${HOME}/${CARGO_HOME}/config.toml"
          [net]
          git-fetch-with-cli = true

          [registry]
          global-credential-providers = ["cargo:token"]
          EOF

          if [ "$CRATE_REGISTRY_NAME" != "crates-io" ]; then
            cat << EOF >> "${HOME}/${CARGO_HOME}/config.toml"
          [registries.${CRATE_REGISTRY_NAME}]
          index = "${CRATE_REGISTRY_INDEX_URL}"
          EOF

            cat << EOF >> "${HOME}/${CARGO_HOME}/credentials.toml"
          [registries.${CRATE_REGISTRY_NAME}]
          token = "${SHIPYARD_RS_TOKEN}"
          EOF
          fi

          echo "CARGO_HOME=${HOME}/${CARGO_HOME}" >> "$GITHUB_ENV"
          echo "CRATE_REGISTRY_NAME=${CRATE_REGISTRY_NAME}" >> "$GITHUB_ENV"
          if [[ -n "${CRATE_REGISTRY_INDEX_URL:-}" ]]; then
            echo "CRATE_REGISTRY_INDEX_URL=${CRATE_REGISTRY_INDEX_URL}" >> "$GITHUB_ENV"
          fi
        shell: bash
      - name: Install cargo-llvm-cov
        run: nix profile install github:NixOS/nixpkgs/4590696c8693fea477850fe379a01544293ca4e2#cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov nextest --all-features --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
      - if: '!cancelled()'
        name: Upload test results
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
