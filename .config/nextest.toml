experimental = ["setup-scripts"]

[profile.ci]
fail-fast = false
[profile.ci.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

[script.start-e2e-env]
command =  "./.config/starte2e.sh"

[[profile.default.scripts]]
filter = "test(test_binary)"
setup = "start-e2e-env"
